
services:
  api:
    build: .
    container_name: hdfs-anomaly-api
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: "postgresql://hdfs:${POSTGRES_PASSWORD}@postgres:5432/hdfs_monitor"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/raw:/app/data/raw:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: hdfs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hdfs_monitor
      POSTGRES_USER: hdfs
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hdfs -d hdfs_monitor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
